# Alojamiento gratis en Render. La base no va aquí: el Postgres gratis de Render
# se borra a los 30 días. DATABASE_URL sale de un proyecto gratis de Neon.
services:
  - type: web
    name: ygstock
    env: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn --config gunicorn-cfg.py config.wsgi
    envVars:
      - key: DJANGO_ENVIRONMENT
        value: production
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: USE_X_FORWARDED_PROTO
        value: "1"
      - key: DATABASE_URL
        sync: false

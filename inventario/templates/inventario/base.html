{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block titulo %}Inventario{% endblock %} · YG Stock</title>
  <link rel="stylesheet" href="{% static 'inventario/app.css' %}?v=14">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header class="barra">
    <a class="marca" href="{% url 'inventario:lista' %}">
      <span class="marca-yg">YG</span>
      <span class="marca-texto">Stock <small>Inventario</small></span>
    </a>
    <nav>
      <a class="{% if request.resolver_match.url_name == 'lista' or request.resolver_match.url_name == 'historial' %}activo{% endif %}" href="{% url 'inventario:lista' %}">
        <svg class="icono" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.2 2.2h4.6v4.6H2.2zM9.2 2.2h4.6v4.6H9.2zM2.2 9.2h4.6v4.6H2.2zM9.2 9.2h4.6v4.6H9.2z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        Inventario
      </a>
      <a class="{% if request.resolver_match.url_name == 'cargas' or request.resolver_match.url_name == 'cargar' %}activo{% endif %}" href="{% url 'inventario:cargas' %}">
        <svg class="icono" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5 8 2l6 2.5L8 7 2 4.5ZM2 8l6 2.5L14 8M2 11.5 8 14l6-2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Cargas
      </a>
    </nav>
  </header>

  {% if messages %}
    <div class="avisos">
      {% for message in messages %}
        <p class="aviso aviso-{{ message.tags }}">{{ message }}</p>
      {% endfor %}
    </div>
  {% endif %}

  <main class="pagina">
    {% block contenido %}{% endblock %}
  </main>
  <nav class="menu-movil" aria-label="Secciones">
    <a class="{% if request.resolver_match.url_name == 'lista' or request.resolver_match.url_name == 'historial' %}activo{% endif %}" href="{% url 'inventario:lista' %}">
      <svg class="icono" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.2 2.2h4.6v4.6H2.2zM9.2 2.2h4.6v4.6H9.2zM2.2 9.2h4.6v4.6H2.2zM9.2 9.2h4.6v4.6H9.2z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      Inventario
    </a>
    <a class="{% if request.resolver_match.url_name == 'cargas' or request.resolver_match.url_name == 'cargar' %}activo{% endif %}" href="{% url 'inventario:cargas' %}">
      <svg class="icono" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5 8 2l6 2.5L8 7 2 4.5ZM2 8l6 2.5L14 8M2 11.5 8 14l6-2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Cargas
    </a>
  </nav>
  <script>
    document.addEventListener("click", function (evento) {
      const boton = evento.target.closest ? evento.target.closest(".copiar") : null;
      if (!boton) return;
      const codigo = boton.dataset.copiar || "";
      function marcar() {
        boton.classList.add("copiado");
        boton.setAttribute("aria-label", "Código copiado");
        window.setTimeout(function () {
          boton.classList.remove("copiado");
          boton.setAttribute("aria-label", "Copiar código");
        }, 1200);
      }
      function copiarConArea() {
        const area = document.createElement("textarea");
        area.value = codigo;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.left = "-9999px";
        document.body.appendChild(area);
        area.select();
        const ok = document.execCommand("copy");
        area.remove();
        return ok;
      }
      const porArea = copiarConArea();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(codigo).then(marcar).catch(function () {
          if (porArea) marcar();
        });
        return;
      }
      if (porArea) marcar();
    });
  </script>
</body>
</html>
